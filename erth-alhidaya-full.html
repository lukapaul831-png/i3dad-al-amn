م","الدفاع"],correct:1,explanation:"النيابة العامة تأمر بفتح البحث التمهيدي الذي تباشره الشرطة القضائية تحت إشرافها."},{id:14,corps:"dabit_shorta",category:"المسطرة الجنائية",question:"ما هي حالات بطلان إجراءات الحراسة النظرية؟",options:["عدم إشعار عائلة المحتجز","عدم عرض المحتجز على النيابة","تعذيب المحتجز","جميع ما ذكر"],correct:3,explanation:"يترتب البطلان عن عدم احترام الضمانات الأساسية: الإشعار، العرض على النيابة، حظر التعذيب، وحق الدفاع."},{id:15,corps:"dabit_shorta",category:"القانون الجنائي",question:"ما هي ظروف التشديد في جريمة السرقة؟",options:["الليل وحمل السلاح والتعدد","النهار فقط","السرقة البسيطة","لا توجد ظروف تشديد"],correct:0,explanation:"المادة 510 تنص على تشديد العقوبة إذا اقترنت السرقة بظروف الليل، حمل السلاح، التعدد، الكسر، أو استعمال العنف."},{id:16,corps:"dabit_shorta",category:"الشرطة القضائية",question:"ما المقصود بالإنابة القضائية؟",options:["تفويض قاضي التحقيق لضابط الشرطة للقيام بإجراء","تفويض المحامي","تفويض القاضي لنفسه","لا وجود لها"],correct:0,explanation:"الإنابة القضائية هي تكليف قاضي التحقيق لضباط الشرطة القضائية للقيام ببعض إجراءات التحقيق الإعدادي."},{id:17,corps:"dabit_shorta",category:"الحقوق والحريات",question:"ما هي حقوق الدفاع في مرحلة الحراسة النظرية بعد تعديل 2011؟",options:["الاتصال بمحام بعد 24 ساعة","الصمت وعدم الإدلاء بأقوال","الاتصال بالأقارب","جميع ما ذكر"],correct:3,explanation:"عزز تعديل المسطرة الجنائية حقوق الدفاع: حق الصمت، الاتصال بمحام، إشعار العائلة، والفحص الطبي."},{id:18,corps:"dabit_shorta",category:"التنظيم الإداري",question:"ما هي اختصاصات الوالي؟",options:["تمثيل الدولة والإشراف على المصالح اللاممركزة","التشريع","القضاء","لا اختصاص له"],correct:0,explanation:"الوالي يمثل السلطة المركزية، يسهر على النظام العام، وينسق أنشطة المصالح اللاممركزة للدولة."},{id:19,corps:"dabit_shorta",category:"القانون الجنائي",question:"ما هو الفرق بين الفاعل الأصلي والمشارك؟",options:["الفاعل ينفذ الجريمة مباشرة والمشارك يساعد","لا فرق","المشارك أخطر","الفاعل لا يعاقب"],correct:0,explanation:"الفاعل الأصلي منفذ الركن المادي يضمن حق الحصول على المعلومة، وتم إصدار قانون 31.13 لتنظيمه."},{id:27,corps:"dabit_shorta",category:"التنظيم الإداري",question:"ما هي الجماعة الترابية؟",options:["شخص معنوي خاضع للقانون العام","شركة خاصة","جمعية","لا وجود لها"],correct:0,explanation:"الجماعات الترابية أشخاص معنوية عامة تتمتع بالاستقلال الإداري والمالي وتدير شؤونها بكيفية ديمقراطية."},{id:28,corps:"dabit_shorta",category:"القانون الجنائي",question:"ما هي جريمة الرشوة؟",options:["طلب أو قبول فائدة للقيام بعمل من أعمال الوظيفة","هدية بسيطة","مكافأة قانونية","لا تعتبر جريمة"],correct:0,explanation:"الرشوة هي طلب أو قبول عرض أو وعد أو هبة للقيام بعمل أو الامتناع عن عمل من أعمال الوظيفة."},{id:29,corps:"dabit_shorta",category:"الشرطة القضائية",question:"ما هو دور النيابة العامة في البحث التمهيدي؟",options:["الإشراف والتوجيه وإعطاء التعليمات","لا دور لها","التنفيذ فقط","الحكم"],correct:0,explanation:"النيابة العامة تشرف على البحث التمهيدي وتوجه ضباط الشرطة القضائية وتعطيهم التعليمات."},{id:30,corps:"dabit_shorta",category:"المسطرة الجنائية",question:"ما هي قرائن الإثبات في المادة الجنائية؟",options:["الاعتراف، الشهود، الخبرة، القرائن","الاعتراف فقط","الشهود فقط","لا توجد"],correct:0,explanation:"وسائل الإثبات: الاعتراف، شهادة الشهود، الخبرة، المعاينة، القرائن، والمحاضر."},{id:31,corps:"dabit_shorta",category:"الحقوق والحريات",question:"ما هي حرية التعبير؟",options:["حق دستوري مضمون مع احترام القانون","مطلقة بدون قيود","ممنوعة","خاصة بالصحافة فقط"],correct:0,explanation:"حرية الفكر والرأي والتعبير مضمونة دستوريا في إطار احترام الثوابت والقانون."},{id:32,corps:"dabit_shorta",category:"القانون الجنائي",question:"ما هي العقوبات البديلة في القانون المغربي الجديد؟",options:["العمل لأجل المنفعة العامة والمراقبة الإلكترونية","الإعدام فقط","السجن فقط","لا وجود لها"],correct:0,explanation:"قانون 43.22 أقر العقوبات البديلة: العمل للمنفعة العامة، المراقبة الإلكترونية، الغرامة اليومية، وتقييد الحقوق."},{id:33,corps:"dabit_shorta",category:"التنظيم الإداري",question:"ما هو مبدأ التدبير الحر؟",options:["تدبير الجماعات لشؤ راغنة"],correct:0,explanation:"مراكش هي عاصمة جهة مراكش آسفي."},{id:41,corps:"haris",category:"الأمن الوطني",question:"ما هي الرتب في الأمن الوطني من الأدنى إلى الأعلى؟",options:["حارس، مقدم، مفتش، ضابط، عميد","عميد أولا","لا ترتيب","كل الرتب متساوية"],correct:0,explanation:"التسلسل: حارس أمن، مقدم شرطة، مفتش، ضابط أمن/شرطة، عميد."},{id:42,corps:"haris",category:"القانون",question:"ما هي أنواع الشرطة؟",options:["إدارية وقضائية","إدارية فقط","قضائية فقط","لا أنواع"],correct:0,explanation:"الشرطة نوعان: إدارية وقائية لحفظ النظام، وقضائية زجرية للبحث عن الجرائم."},{id:43,corps:"haris",category:"ثقافة عامة",question:"كم عدد أعضاء مجلس الأمن الدولي؟",options:["15 عضوا (5 دائمون)","10","20","5 فقط"],correct:0,explanation:"مجلس الأمن يتكون من 15 عضوا: 5 دائمون بحق الفيتو و10 غير دائمين."},{id:44,corps:"haris",category:"الأمن الوطني",question:"ما هي وثائق الهوية في المغرب؟",options:["البطاقة الوطنية للتعريف الإلكترونية","جواز السفر","رخصة السياقة","كل ما ذكر يثبت الهوية لكن الرسمية هي البطاقة"],correct:3,explanation:"البطاقة الوطنية هي الوثيقة الرسمية لإثبات الهوية، وجواز السفر ورخصة السياقة تثبت الهوية أيضا."},{id:45,corps:"haris",category:"القانون",question:"ما هي حالة الدفاع الشرعي؟",options:["دفع اعتداء حال غير مشروع","الاعتداء ابتداء","الانتقام","لا وجود له"],correct:0,explanation:"الدفاع الشرعي هو حق دفع اعتداء حال غير مشروع عن النفس أو المال بشروط التناسب."},{id:46,corps:"haris",category:"ثقافة عامة",question:"ما هو أطول نهر في المغرب؟",options:["نهر درعة","نهر أم الربيع","نهر سبو","نهر ملوية"],correct:0,explanation:"نهر درعة أطول أنهار المغرب بطول 1100 كلم، ينبع من الأطلس الكبير."},{id:47,corps:"haris",category:"الأمن الوطني",question:"ما هي الشرطة العلمية؟",options:["مصلحة تقنية تستعمل العلم لكشف الجريمة","شرطة السير","شرطة الحدود","لا وجود لها"],correct:0,explanation:"الشرطة العلمية والتقنية تستعمل البصمات، الحمض النووي، والخبرة التقنية لإثبات الجريمة."},{id:48,corps:"haris",category:"القانون",question:"ما هي أنواع المحاكم المغربية؟",options:["ابتدائية واستئنافية ونقض ومختصة","ابتدائية فقط","لا محاكم","محكمة واحدة"],correct:0,explanation:"التنظيم القضائي: محاكم ابتدائية، استئنافية، محكمة النقض، ومحاكم مختصة (إدارية، تجارية)."},{id:49,corps:"haris",category:"ثقافة عامة",question:"متى تم إقرار دستور 2011؟",options:["1 يوليوز 2011","2010","2012","2000"],correct:0,explanation:"تم الاستفتاء على دستور 2011 يوم 1 يوليوز 2011 وصوت عليه بنعم بأغلبية ساحقة."},{id:50,corps:"haris",category:"الأمن الوطني",question:"ما هو دور شرطة المرور؟",options:["تنظيم السير والجولان والوقاية من حوادث السير","التحقيق في الجرائم","حراسة الحدود","لا دور"],correct:0,explanation:"شرطة المرور تسهر على تنظيم حركة السير والجولان والحد من حوادث السير."},{id:51,corps:"haris",category:"القانون",question:"ما هي الجريمة الفورية؟",options:["تقع وتنتهي في لحظة","مستمرة","لا تقع","مستقبلية"],correct:0,explanation:"الجريمة الفورية هي التي يتحقق ركنها المادي في لحظة واحدة كالقتل والسرقة."},{id:52,corps:"haris",category:"ثقافة عامة",question:"ما هي المسيرة الخضراء؟",options:["مسيرة سلمية سنة 1975 لاسترجاع الصحراء","حرب","مظاهرة","لا حدث"],correct:0,explanation:"المسيرة الخضراء انطلقت يوم 6 نونبر 1975 بمبادرة من الملك الحسن الثاني لاسترجاع الصحراء."},{id:53,corps:"haris",category:"الأمن الوطني",question:"ما هو الرقم الأخضر للأمن؟",options:["19","15","177","177 و 19"],correct:3,explanation:"الرقم 19 للشرطة و 177 للدرك الملكي، و 15 للوقاية المدنية."},{id:54,corps:"haris",category:"القانون",question:"ما هي العقوبات الأصلية؟",options:["الإعدام والسجن والحبس والغرامة","الغرامة فقط","لا عقوبات","الإعدام فقط"],correct:0,explanation:"العقوبات الأصلية في القانون الجنائي المغربي: الإعدام، السجن المؤبد والمؤقت، الحبس، والغرامة."},{id:55,corps:"haris",category:"ثقافة عامة",question:"ما هي أكبر جهة من حيث المساحة؟",options:["الداخلة وادي الذهب","الدار البيضاء","الرباط","فاس"],correct:0,explanation:"جهة الداخلة وادي الذهب أكبر جهات المملكة مساحة."},{id:56,corps:"haris",category:"الأمن الوطني",question:"ما هي البطاقة الوطنية البيومترية؟",options:["وثيقة هوية إلكترونية ببصمة ومعطيات بي مضمونة دستوريا وتمارس وفق الشروط المحددة في ظهير الحريات العامة."},{id:64,corps:"dabit_amn",category:"الأمن والنظام",question:"ما هي أنواع حفظ النظام؟",options:["حفظ النظام العادي والاستثنائي","نوع واحد","لا أنواع","عسكري فقط"],correct:0,explanation:"حفظ النظام العادي في الظروف العادية، والاستثنائي في حالات الطوارئ والحصار."},{id:65,corps:"dabit_amn",category:"القانون الإداري",question:"ما هو التفويض الإداري؟",options:["نقل جزء من الاختصاص من الأصيل إلى المفوض له","نقل الملكية","لا وجود له","تفويض قضائي"],correct:0,explanation:"التفويض نقل مؤقت لجزء من الاختصاص مع بقاء المسؤولية على عاتق الأصيل."},{id:66,corps:"dabit_amn",category:"الثقافة الأمنية",question:"ما هي الجريمة السيبرانية؟",options:["جريمة ترتكب عبر الأنترنت والأنظمة المعلوماتية","جريمة عادية","لا جريمة","جريمة سياسية"],correct:0,explanation:"الجريمة السيبرانية ترتكب باستخدام الأنترنت وتستهدف الأنظمة والمعطيات."},{id:67,corps:"dabit_amn",category:"الأمن والنظام",question:"ما هي الشرطة الإدارية الخاصة؟",options:["شرطة مكلفة بمجال خاص كالتعمير والصحة","شرطة عامة","لا وجود لها","شرطة قضائية"],correct:0,explanation:"الشرطة الإدارية الخاصة تنظم مجالا معينا: شرطة التعمير، الصحة، البيئة، السينما... إلخ."},{id:68,corps:"dabit_amn",category:"القانون الإداري",question:"ما هو العقد الإداري؟",options:["عقد تبرمه الإدارة ويتضمن شروطا استثنائية","عقد مدني","لا عقد","عقد شغل"],correct:0,explanation:"العقد الإداري يبرم من طرف شخص معنوي عام ويهدف لتسيير مرفق عام ويتضمن امتيازات للسلطة العامة."},{id:69,corps:"dabit_amn",category:"الحريات العامة",question:"ما هي حالة الطوارئ الصحية؟",options:["نظام قانوني استثنائي لمواجهة خطر صحي","حالة عادية","لا وجود لها","حالة حرب"],correct:0,explanation:"حالة الطوارئ الصحية نظام استثنائي يمكن السلطات من اتخاذ تدابير لحماية الصحة العامة."},{id:70,corps:"dabit_amn",category:"الثقافة الأمنية",question:"ما هو الإرهاب؟",options:["استعمال العنف لتحقيق أهداف سياسية أو إيديولوجية","رأي سياسي","جريمة عادية","لا تعريف"],correct:0,explanation:"الإرهاب كل فعل يهدف لبث الرعب وتهديد الأمن العام لتحقيق أهداف سياسية."},{id:71,corps:"dabit_amn",category:"الأمن والنظام",question:"ما هو دور القوات المساعدة؟",options:["مساندة الأمن الوطني والدرك في حفظ النظام","القضاء","التشريع","لا دور"],correct:0,explanation:"القوات المساعدة قوة عمومية تساند الأمن والدرك في حفظ النظام وحراسة الحدود."},{id:72,corps:"dabit_amn",category:"القانون الإداري",question:"ما هي مسؤولية الإدارة؟",options:["التزام الإدارة بتعويض الضرر الناتج عن أعمالها","لا مسؤولية","مسؤولية جنائية فقط","مسؤولية مدنية فقط"],correct:0,explanation:"مسؤولية الإدارة قد تكون بدون خطأ (المخاطر) أو بخطأ (مرفقي)."},{id:73,corps:"dabit_amn",category:"الحريات العامة",question:"ما هو مبدأ المساواة أمام القانون؟",options:["عدم التمييز بين المواطنين أمام القانون","تمييز الأغنياء","لا مساواة","مساواة شكلية فقط"],correct:0,explanation:"مبدأ دستوري يضمن المساواة بين المواطنين دون تمييز بسبب الجنس أو اللون أو المعتقد."},{id:74,corps:"dabit_amn",category:"الثقافة الأمنية",question:"ما هي الهجرة غير الشرعية؟",options:["عبور الحدود بدون وثائق قانونية","هجرة قانونية","سياحة","لا وجود لها"],correct:0,explanation:"الهجرة السرية ظاهرة اجتماعية وأمنية تتطلب مقاربة شاملة أمنية وتنموية."},{id:75,corps:"dabit_amn",category:"الأمن والنظام",question:"ما هي الوقاية المدنية؟",options:["جهاز مكلف بحماية الأشخاص والممتلكات من الكوارث","جهاز عسكري","لا جهاز","شرطة"],correct:0,explanation:"الوقاية المدنية جهاز عمومي مكلف بالإنقاذ والإسعاف ومكافحة الحرائق والكوارث."},{id:76,corps:"dabit_amn",category:"القانون الإداري",question:"ما هو المرفق العام؟",options:["نشاط تتولاه الإدارة لتحقيق مصلحة عامة","شركة خاصة","جمعية","لا مرفق"],correct:0,explanation:"المرفق العام نشاط عام يهدف لتحقيق المصلحة العامة ويخضع لمبادئ المساواة والاستمرارية."},{id:77,corps:"dabit_amn",category:"الحريات العامة",question:"ما هي الجمعية؟",options:["اتفاق بين شخصين أو أكثر لتحقيق غاية غير مادية","شركة","حزب","لا تعريف"],correct:0,explanation:"الجمعية اتفاق لتحقيق تعاون في غاية غير توزيع الأرباح، وتخضع لظهير الحريات العامة."},{id:78,corps:"dabit_amn",category:"الثقافة الأمنية",question:"ما هو تبييض الأموال؟",options:["إخفاء المصدر غير المشروع للأموال وإعطاؤها صبغة مشروعة","عمل بنكي","تجارة مشروعة","لا جريمة"],correct:0,explanation:"تبييض الأموال جريمة تتمثل في إضفاء المشروعية على أموال متحصلة من جريمة."},{id:79,corps:"dabit_amn",category:"الأمن والنظام",question:"ما هي الجريمة المنظمة؟",options:["نشاط إجرامي جماعي منظم عابر للحدود","جريمة فردية","لا جريمة","جنحة بسيطة"],correct:0,explanation:"الجريمة المنظمة نشاط جماعي منظم يهدف للربح عبر أنشطة غير مشروعة كالمخدرات والاتجار بالبشر."},{id:80,corps:"dabit_amn",category:"القانون الإداري",question:"ما هو القرار التأديبي؟",options:["قرار يعاقب الموظف على إخلاله بواجباته","مكافأة","ترقية","لا قرار"],correct:0,explanation:"القرار التأديبي يصدر بعد مسطرة تأديبية ويتضمن عقوبات من الإنذار إلى العزل."},{id:81,corps:"mofatish",category:"التحليل والاستنتاج",question:"في قضية سرقة، وجدت بصمات المشتبه به في مسرح الجريمة لكنه يدعي أنه زار المكان قبل يومين. ما الإجراء؟",options:["التحقق من شهود الزيارة ومطابقة زمن البصمات","إخلاء سبيله فورا","اتهامه مباشرة","تجاهل البصمات"],correct:0,explanation:"المحقق الناجح يواجه الفرضيات بالأدلة التقنية والشهود ولا يكتفي بالاعتراف أو الإنكار."},{id:82,corps:"mofatish",category:"التنظيم القضائي",question:"ما هي اختصاصات محكمة الاستئناف؟",options:["النظر استئنافيا في الأحكام الابتدائية وجنائيا ابتدائيا في الجنايات","النظر فقط في الجنح","لا اختصاص","النظر في المخالفات فقط"],correct:0,explanation:"محكمة الاستئناف تنظر في استئناف الأحكام الابتدائية وتبت ابتدائيا في الجنايات بغرفة الجنايات."},{id:83,corps:"mofatish",category:"التحليل والاستنتاج",question:"كيف تتعامل مع تضارب أقوال الشهود؟",options:["مواجهتهم والبحث عن قرائن مادية تؤكد رواية","تصديق أحدهم عشوائيا","إهمال الشهادات","اعتبار الجميع كاذبين"],correct:0,explanation:"تضارب الشهادات يتطلب مواجهة دقيقة وبحث عن أدلة مادية وقرائن موضوعية."},{id:84,corps:"mofatish",category:"القانون الجنائي الخاص",question:"ما هي جريمة النصب؟",options:["الاستيلاء على مال الغير باستعمال الحيلة والخداع","سرقة بسيطة","خيانة الأمانة","لا ج ة القضائية تدبير بديل للاعتقال الاحتياطي مدته شهران قابلة للتمديد."},{id:92,corps:"mofatish",category:"التحليل والاستنتاج",question:"كيف تثبت جريمة المخدرات؟",options:["بالحجز والخبرة التقنية والاعتراف والمراقبة","بالاعتراف فقط","لا تثبت","بالشهود فقط"],correct:0,explanation:"إثبات المخدرات يتطلب الحجز، الوزن، الخبرة المخبرية، والمراقبة والتتبع."},{id:93,corps:"mofatish",category:"القانون الجنائي الخاص",question:"ما هي جريمة العنف ضد الأصول؟",options:["ظرف تشديد إذا كان المجني عليه أصلا للجاني","جنحة عادية","لا تشديد","مباحة"],correct:0,explanation:"العنف ضد الأصول (الأب، الأم، الجد) يعتبر ظرف تشديد في القانون الجنائي."},{id:94,corps:"mofatish",category:"التنظيم",question:"ما هو دور قاضي التحقيق؟",options:["البحث عن الحقيقة وجمع أدلة البراءة والإدانة","الإدانة فقط","البراءة فقط","لا دور"],correct:0,explanation:"قاضي التحقيق يبحث عن الحقيقة بموضوعية ويجمع أدلة الإدانة والبراءة."},{id:95,corps:"mofatish",category:"التحليل والاستنتاج",question:"ما هي الخبرة القضائية؟",options:["إجراء يأمر به القاضي للاستعانة بخبير فني","شهادة شاهد","اعتراف","لا إجراء"],correct:0,explanation:"الخبرة وسيلة إثبات فنية يأمر بها القاضي للاستنارة برأي خبير في مسألة تقنية."},{id:96,corps:"mofatish",category:"القانون الجنائي الخاص",question:"ما هي جريمة الاتجار بالبشر؟",options:["تجنيد أو نقل أو إيواء أشخاص لغرض الاستغلال","عمل مشروع","هجرة عادية","لا جريمة"],correct:0,explanation:"الاتجار بالبشر جريمة منظمة تشمل الاستغلال الجنسي أو العمل القسري أو نزع الأعضاء."},{id:97,corps:"mofatish",category:"التنظيم",question:"ما هي غرفة الجنايات؟",options:["هيئة داخل محكمة الاستئناف تبت في الجنايات","محكمة ابتدائية","لا وجود لها","محكمة إدارية"],correct:0,explanation:"غرفة الجنايات الابتدائية والاستئنافية بمحكمة الاستئناف تختص بالبت في الجنايات."},{id:98,corps:"mofatish",category:"التحليل والاستنتاج",question:"كيف تحلل جريمة قتل غامضة بدون شهود؟",options:["بمسرح الجريمة، الطب الشرعي، الاتصالات، والدوافع","بالتخمين","لا تحليل","بالاعتراف فقط"],correct:0,explanation:"التحقيق الحديث يعتمد على الأدلة العلمية: مسرح الجريمة، التشريح، البصمات، والتحليل الرقمي."},{id:99,corps:"mofatish",category:"القانون الجنائي الخاص",question:"ما هو الفرق بين القتل العمد وشبه العمد؟",options:["العمد بنية إزهاق الروح وشبه العمد بدون نية القتل","لا فرق","شبه العمد أخطر","العمد غير معاقب"],correct:0,explanation:"القتل العمد يتطلب نية القتل، بينما شبه العمد اعتداء أدى للموت دون نية إزهاق الروح."},{id:100,corps:"mofatish",category:"التنظيم",question:"ما هي النيابة العامة؟",options:["جهاز قضائي يمثل المجتمع ويسهر على تطبيق القانون","محاماة","قضاء الحكم","لا جهاز"],correct:0,explanation:"النيابة العامة تمثل المجتمع وتسهر على تطبيق القانون وتحريك الدعوى العمومية."},{id:101,corps:"mofatish",category:"التحليل والاستنتاج",question:"ما هي أهمية التنقيط (التشخيص القضائي)؟",options:["تحديد هوية المشتبه بهم عبر البصمات والصور","لا أهمية","للأرشيف فقط","للزينة"],correct:0,explanation:"التشخيص القضائي قاعدة بيانات للبصمات والصور تساعد في التعرف على المجرمين."},{id:102,corps:"mofatish",category:"القانون الجنائي الخاص",question:"ما هي جريمة إهانة موظف؟",options:["سب أو قذف موظف أثناء قيامه بمهامه","مدح الموظف","لا جريمة","حرية تعبير"],correct:0,explanation:"إهانة موظف عمومي أثناء قيامه بمهامه جريمة يعاقب عليها القانون."},{id:103,corps:"mofatish",category:"التنظيم",question:"ما هو الإكراه البدني؟",options:["وسيلة لإجبار المحكوم عليه على تنفيذ الالتزام المالي","تعذيب","لا وجود له","عقوبة أصلية"],correct:0,explanation:"الإكراه البدني وسيلة لإكراه المدين على الوفاء بالغرامات والمصاريف القضائية."},{id:104,corps:"mofatish",category:"التحليل والاستنتاج",question:"ما هي القرائن التي تدل على الكذب أثناء الاستنطاق؟",options:["التناقض، التردد، لغة الجسد، وعدم منطقية الرواية","لا قرائن","الصدق دائما","لا يمكن الكشف"],correct:0,explanation:"المحقق المحترف يلاحظ التناقضات ولغة الجسد والتفاصيل غير المنطقية لكشف الكذب."},{id:105,corps:"mofatish",category:"القانون الجنائي الخاص",question:"ما هي عقوبة حمل السلاح بدون رخصة؟",options:["حبس وغرامة حسب نوع السلاح","لا عقوبة","مباحة","غرامة فقط"],correct:0,explanation:"حمل السلا
